# Sammy Monitor Configuration Sample
# Copy this file to settings.toml and customize for your environment

# Path to the SQLite database file (relative to working directory or absolute)
db_path = "./sammy_monitor.db"

# Number of consecutive failures before a DOWN alert is sent.
# Example: with interval = 1 (minute) and threshold = 5, alerts after ~5 minutes down.
down_alert_threshold = 5

# SMTP credentials are loaded from environment variables, not this file.
# Copy .env to .env.local and set your real values there (.env.local is gitignored).
#
# Required:
#   SMTP_HOST   — SMTP server hostname
#   SMTP_PORT   — SMTP port (587 for STARTTLS, 465 for implicit TLS)
#   SMTP_USER   — SMTP login username
#   SMTP_PASS   — SMTP password
#   SMTP_FROM   — Sender address
#   SMTP_TO     — Recipient address(es), comma-separated
#
# Optional:
#   SMTP_TLS    — true (default) or false

[[monitors]]
# Human-readable name for this monitor
name = "Example Website"
# URL to monitor (HTTP/HTTPS) — the ID is derived automatically from this URL
url = "https://example.com"
# Check interval in minutes (1 = every minute, 5 = every 5 minutes, etc.)
interval = 5
# Whether this monitor is enabled (true/false)
enabled = true

[[monitors]]
name = "Google Search"
url = "https://www.google.com"
interval = 1
enabled = true

[[monitors]]
name = "GitHub"
url = "https://github.com"
interval = 2
enabled = false

# Add more monitors as needed by copying the [[monitors]] block above
