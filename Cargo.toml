[package]
name = "sammy_monitor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Simple HTTP monitoring service with Prometheus metrics"
authors = ["Greg Hewett <glh@strand3.com>"]

[lib]
name = "sammy_monitor"
path = "src/lib.rs"

[[bin]]
name = "sammy_monitor"
path = "src/main.rs"

[dependencies]
# Core runtime
anyhow = "1.0"
tokio = { version = "1.36", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "native-tls"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Email
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "tokio1-native-tls", "builder"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Environment
dotenvy = "0.15"

# Time and IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "v5", "serde"] }

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.8"
mockito = "1.6"