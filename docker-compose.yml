version: '3.8'

services:
  sammy_monitor:
    image: ghcr.io/glhewett/sammy_monitor:latest
    container_name: sammy-monitor
    volumes:
      - ./settings.toml:/app/settings.toml:ro
      - sammy_db:/app/data
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  sammy_db:

networks:
  monitoring:
    driver: bridge
